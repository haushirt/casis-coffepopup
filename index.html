<html lang="de">
<head>

<title>Justus Surf Paradise</title>
<style>
  :root{
    --gelb:#FFD400;
    --rot:#E4243C;
    --tinte:#131313;
    --schaum:#EAF7FA;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:radial-gradient(circle at 50% -10%, #35A9C4 0%, #0A4F68 60%, #06344a 100%);
    color:var(--tinte);

    gap:14px;padding:16px;

    font-size:clamp(20px,4.5vw,34px);

    text-shadow:3px 3px 0 var(--rot), 6px 6px 0 rgba(0,0,0,.35);
    margin:0;
  }
  .buehne{
    position:relative;width:min(100%,860px);
    border:5px solid var(--tinte);border-radius:18px;overflow:hidden;
    box-shadow:0 18px 40px rgba(0,0,0,.45);background:#0E7C9B;line-height:0;
  }
  canvas{width:100%;height:auto;display:block;touch-action:none}
  .hinweis{color:var(--schaum);font-size:14px;text-align:center;opacity:.85;max-width:620px;line-height:1.5;margin:0}
  kbd{background:var(--gelb);color:var(--tinte);border-radius:5px;padding:1px 7px;
      font-family:inherit;font-weight:700;font-size:13px;box-shadow:0 2px 0 rgba(0,0,0,.5)}
</style>
</head>

053FD++6S3y07Jqamh9dWcm8/w3kYTnKmJSZnQAAAABJRU5ErkJggg==";
  const SH = 120, SW = Math.round(120 * 174 / 300);

  let zustand = 'start';
  let t = 0, tempo = 4.2, punkte = 0, muscheln = 0, leben = 3, unverwundbar = 0, bestwert = 0;
  const hindernisse = [], sammler = [], gischt = [];
  const justus = { x: 190, y: H/2, vx: 0, vy: 0, r: 26, neigung: 0 };
  const taste = {};

  /* ---------- Eingabe ---------- */
  const pfeile = ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '];
  addEventListener('keydown', e => {
    if (pfeile.includes(e.key)) e.preventDefault();
    taste[e.key] = true;
    if ((e.key === ' ' || e.key === 'Enter') && zustand !== 'laeuft') neuStarten();
  });
  addEventListener('keyup', e => taste[e.key] = false);

  let zieh = null;
  const punktAus = e => {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * B / r.width, y: (e.clientY - r.top) * H / r.height };
  };
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (zustand !== 'laeuft'){ neuStarten(); return; }
    zieh = punktAus(e);
  });
  cv.addEventListener('pointermove', e => { if (zieh) zieh = punktAus(e); });
  addEventListener('pointerup', () => zieh = null);

  /* ---------- Ablauf ---------- */
  function neuStarten(){
    zustand = 'laeuft';
    t = 0; tempo = 4.2; punkte = 0; muscheln = 0; leben = 3; unverwundbar = 60;
    hindernisse.length = 0; sammler.length = 0; gischt.length = 0;
    Object.assign(justus, { x:190, y:H/2, vx:0, vy:0, neigung:0 });
  }

  const koerper = () => ({ x: justus.x, y: justus.y - 14, r: justus.r });
  const kollision = (a,b,puffer=0) => Math.hypot(a.x-b.x, a.y-b.y) < a.r + b.r + puffer;

  function neuesHindernis(){
    const a = Math.random(), y = 90 + Math.random() * (H - 170);
    if (a < .42)      hindernisse.push({ typ:'fels',   x:B+60, y, r:30, ph:Math.random()*TAU });
    else if (a < .74) hindernisse.push({ typ:'boje',   x:B+60, y, r:24, ph:Math.random()*TAU });
    else              hindernisse.push({ typ:'qualle', x:B+60, y, r:22, ph:Math.random()*TAU });
  }

  function aktualisieren(){
    t++;
    tempo = Math.min(11, 4.2 + t * 0.0014);
    punkte += tempo * 0.06;
    if (unverwundbar > 0) unverwundbar--;

    let zx = 0, zy = 0;
    if (taste.ArrowLeft) zx -= 1;
    if (taste.ArrowRight) zx += 1;
    if (taste.ArrowUp) zy -= 1;
    if (taste.ArrowDown) zy += 1;
    if (zieh){
      const dx = zieh.x - justus.x, dy = zieh.y - (justus.y - 14), l = Math.hypot(dx,dy) || 1;
      if (l > 14){ zx = dx/l; zy = dy/l; }
    }
    justus.vx += zx * 0.85; justus.vy += zy * 0.85;
    justus.vx *= 0.86; justus.vy *= 0.86;
    justus.x = Math.max(80, Math.min(B*0.62, justus.x + justus.vx));
    justus.y = Math.max(120, Math.min(H - 34, justus.y + justus.vy));
    const ziel = Math.max(-0.3, Math.min(0.3, justus.vy * 0.05 - justus.vx * 0.02));
    justus.neigung += (ziel - justus.neigung) * 0.16;

    if (t % 2 === 0) gischt.push({ x: justus.x - 38, y: justus.y + 8, r: 4 + Math.random()*7, a: 1 });
    for (let i = gischt.length-1; i>=0; i--){
      const g = gischt[i];
      g.x -= tempo*0.8; g.r += 0.35; g.a -= 0.028;
      if (g.a <= 0) gischt.splice(i,1);
    }

    if (t % Math.round(Math.max(26, 70 - tempo*3)) === 0) neuesHindernis();
    if (t % 95 === 0) sammler.push({ x:B+40, y: 100 + Math.random()*(H-170), r:15, ph:Math.random()*TAU });

    for (let i = hindernisse.length-1; i>=0; i--){
      const h = hindernisse[i];
      h.x -= tempo;
      if (h.typ === 'qualle') h.y += Math.sin(t*0.05 + h.ph) * 1.5;
      if (h.x < -70){ hindernisse.splice(i,1); continue; }
      if (unverwundbar <= 0 && kollision(koerper(), h, -8)){
        leben--; unverwundbar = 90;
        for (let k=0;k<16;k++) gischt.push({ x:justus.x, y:justus.y-10, r:3+Math.random()*10, a:1 });
        hindernisse.splice(i,1);
        if (leben <= 0){ zustand = 'vorbei'; bestwert = Math.max(bestwert, Math.floor(punkte)); }
      }
    }

    for (let i = sammler.length-1; i>=0; i--){
      const s = sammler[i];
      s.x -= tempo; s.y += Math.sin(t*0.04 + s.ph) * 0.8;
      if (s.x < -40){ sammler.splice(i,1); continue; }
      if (kollision(koerper(), s, 6)){ muscheln++; punkte += 25; sammler.splice(i,1); }
    }
  }

  /* ---------- Zeichnen ---------- */
  function ozean(){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#1FA8C8'); g.addColorStop(.55,'#0E7C9B'); g.addColorStop(1,'#08405b');
    ctx.fillStyle = g; ctx.fillRect(0,0,B,H);

    ctx.lineWidth = 3;
    for (let r = 0; r < 9; r++){
      const y0 = 40 + r * 54;
      ctx.strokeStyle = `rgba(234,247,250,${0.10 + (r%2)*0.06})`;
      ctx.beginPath();
      for (let x = -40; x <= B+40; x += 12){
        const y = y0 + Math.sin((x + t*tempo*1.4 + r*90) * 0.012) * 9;
        x === -40 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(234,247,250,.5)';
    for (let i = 0; i < 26; i++){
      const x = (i*137 - t*tempo*2.2) % (B+120) - 60;
      const y = 60 + ((i*97) % (H-110));
      ctx.beginPath(); ctx.ellipse(x, y, 16, 3.4, 0, 0, TAU); ctx.fill();
    }
  }

  function umriss(pfad, fuell, strich = TINTE, breite = 3){
    ctx.fillStyle = fuell; pfad(); ctx.fill();
    ctx.lineWidth = breite; ctx.strokeStyle = strich; ctx.stroke();
  }

  function zeichneJustus(){
    if (unverwundbar > 0 && Math.floor(t/4) % 2 === 0) return;
    const wippen = Math.sin(t * 0.11) * 3;
    ctx.save();
    ctx.translate(justus.x, justus.y);
    ctx.rotate(justus.neigung);

    ctx.fillStyle = 'rgba(4,40,60,.3)';
    ctx.beginPath(); ctx.ellipse(6, 26, 56, 15, 0, 0, TAU); ctx.fill();

    if (bildBereit) ctx.drawImage(bild, -SW/2 + 2, 16 - SH + wippen, SW, SH);

    ctx.fillStyle = ROT;
    ctx.beginPath(); ctx.ellipse(0, 22, 46, 3.4, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function zeichneHindernis(h){
    ctx.save(); ctx.translate(h.x, h.y);
    if (h.typ === 'fels'){
      umriss(() => {
        ctx.beginPath();
        ctx.moveTo(-28,16); ctx.lineTo(-14,-16); ctx.lineTo(4,-24);

      }, '#6C7A82');
      ctx.fillStyle = 'rgba(255,255,255,.28)';

    } else if (h.typ === 'boje'){
      const bob = Math.sin(t*0.08 + h.ph) * 3;
      umriss(() => { ctx.beginPath(); ctx.arc(0, bob, 22, 0, TAU); }, ROT);
      ctx.fillStyle = SCHAUM; ctx.beginPath(); ctx.arc(0, bob, 10, 0, TAU); ctx.fill();
      ctx.strokeStyle = TINTE; ctx.lineWidth = 3; ctx.stroke();
    } else {
      const bob = Math.sin(t*0.09 + h.ph) * 4;
      umriss(() => { ctx.beginPath(); ctx.arc(0, bob-4, 18, Math.PI, 0); ctx.closePath(); }, '#E58FD0');
      ctx.strokeStyle = '#C264AC'; ctx.lineWidth = 3;
      for (let i=-2;i<=2;i++){
        ctx.beginPath(); ctx.moveTo(i*7, bob-4);
        ctx.quadraticCurveTo(i*7 + Math.sin(t*0.12+i)*7, bob+10, i*7, bob+22);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

    umriss(() => {
      ctx.beginPath(); ctx.moveTo(0,14);
      ctx.quadraticCurveTo(-18,4,-13,-10);
      ctx.quadraticCurveTo(0,-2,13,-10);
      ctx.quadraticCurveTo(18,4,0,14);
    }, '#FF9EB5', TINTE, 2.5);
    ctx.strokeStyle = 'rgba(19,19,19,.45)'; ctx.lineWidth = 1.6;
    for (const a of [-0.55,0,0.55]){ ctx.beginPath(); ctx.moveTo(0,13); ctx.lineTo(Math.sin(a)*13,-9); ctx.stroke(); }
    ctx.restore();
  }

  function anzeige(){
    ctx.fillStyle = 'rgba(19,19,19,.55)';
    ctx.beginPath(); ctx.roundRect(14, 14, 240, 46, 12); ctx.fill();
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.font = 'bold 24px "Avenir Next","Segoe UI",sans-serif';

    for (let i = 0; i < 3; i++){
      ctx.fillStyle = i < leben ? ROT : 'rgba(19,19,19,.4)';
      ctx.beginPath(); ctx.arc(B - 40 - i*36, 38, 12, 0, TAU); ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = TINTE; ctx.stroke();
    }
  }

  function tafel(kopf, zeilen){
    ctx.fillStyle = 'rgba(6,44,62,.84)'; ctx.fillRect(0,0,B,H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    ctx.save(); ctx.translate(B/2, H/2 - 96);
    ctx.fillStyle = GELB; ctx.beginPath(); ctx.arc(0,0,74,0,TAU); ctx.fill();
    ctx.lineWidth = 6; ctx.strokeStyle = ROT; ctx.stroke();
    if (bildBereit){
      const h2 = 150, w2 = h2 * 174/300;
      ctx.save(); ctx.beginPath(); ctx.arc(0,0,70,0,TAU); ctx.clip();
      ctx.drawImage(bild, -w2/2, -h2/2 - 6, w2, h2);
      ctx.restore();
    }
    ctx.restore();

    ctx.fillStyle = GELB;
    ctx.font = 'bold 42px "Avenir Next","Segoe UI",sans-serif';
    ctx.fillText(kopf, B/2, H/2 + 16);
    ctx.fillStyle = SCHAUM;
    ctx.font = '19px "Avenir Next","Segoe UI",sans-serif';
    zeilen.forEach((z,i) => ctx.fillText(z, B/2, H/2 + 60 + i*29));
  }

  function zeichnen(){
    ozean();
    ctx.globalCompositeOperation = 'lighter';
    for (const g of gischt){
      ctx.fillStyle = `rgba(234,247,250,${g.a*0.5})`;
      ctx.beginPath(); ctx.arc(g.x, g.y, g.r, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    sammler.forEach(zeichneMuschel);
    hindernisse.forEach(zeichneHindernis);
    if (zustand === 'laeuft'){ zeichneJustus(); anzeige(); }

    if (zustand === 'start') tafel('Justus Surf Paradise', [
      'Pfeiltasten: ausweichen und Muscheln einsammeln',
      'Felsen, Bojen und Quallen kosten ein Leben',
      'Leertaste oder tippen zum Start'
    ]);
    if (zustand === 'vorbei') tafel('Wipeout!', [
      `${Math.floor(punkte)} Punkte · ${muscheln} Muscheln`,
      `Bestwert: ${bestwert}`,
      'Leertaste oder tippen für die nächste Welle'
    ]);
  }

  (function schleife(){
    zustand === 'laeuft' ? aktualisieren() : t++;
    zeichnen();
    requestAnimationFrame(schleife);
  })();
})();
</script>
