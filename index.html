let stapel = [];
function naechsteFrage(){
  if (!stapel.length){
    stapel = FRAGEN.map((_,i)=>i);
    for (let i=stapel.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [stapel[i],stapel[j]]=[stapel[j],stapel[i]]; }
  }
  const f = FRAGEN[stapel.pop()];
  const idx = f.a.map((_,i)=>i);
  for (let i=idx.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [idx[i],idx[j]]=[idx[j],idx[i]]; }
  return { k:f.k, f:f.f, a:idx.map(i=>f.a[i]), r:idx.indexOf(f.r) };
}

/* ---------------- Zustand ---------------- */
let modus = 'menue';       // menue | spiel | quiz | ende
let pausiert = false;
let zeit = 0, skala = 1, offX = 0, offY = 0, W = 0, Hh = 0;
let sicherOben = 0, sicherUnten = 0;
let zielPunkte = 5, ton = true, meldung = null, meldungZeit = 0;
let quiz = null, konfetti = [], sieger = null;

const spieler = [
  { key:'justi', x:250, y:BODEN, vx:0, vy:0, r:46, punkte:0, gerettet:0 },
  { key:'casi',  x:750, y:BODEN, vx:0, vy:0, r:46, punkte:0, gerettet:0 }
];
const ball = { x:250, y:190, vx:0, vy:0, r:18, rot:0, ruht:true, halt:80, seite:0, spur:[] };
const taste = {};
const knoepfe = [];

/* ---------------- Ton ---------------- */
let ac = null;
function tonAn(){
  if (!ton) return null;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }catch(e){ return null; }
}
function piep(freq, dauer=0.08, typ='sine', vol=0.12){
  const a = tonAn(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = typ; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0008, a.currentTime + dauer);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dauer);
}

/* ---------------- Maße & iOS ---------------- */
function masse(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);   // 2 reicht, spart Füllrate
  const vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  Hh = Math.round(vv ? vv.height : window.innerHeight);
  cv.width = Math.round(W*dpr); cv.height = Math.round(Hh*dpr);
  skala = Math.min(W/VB, Hh/VH);
  offX = (W - VB*skala)/2; offY = (Hh - VH*skala)/2;
  ctx.setTransform(dpr*skala, 0, 0, dpr*skala, offX*dpr, offY*dpr);
  const st = getComputedStyle(sonde);
  sicherOben  = (parseFloat(st.paddingTop) || 0) / skala;
  sicherUnten = (parseFloat(st.paddingBottom) || 0) / skala;
}
addEventListener('resize', masse);
addEventListener('orientationchange', () => { setTimeout(masse, 120); setTimeout(masse, 450); });
if (window.visualViewport) visualViewport.addEventListener('resize', masse);
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ pausiert = true; for (const k in pad){ pad[k] = {}; } }
  else tonAn();
});

const virt = e => ({ x:(e.clientX - offX)/skala, y:(e.clientY - offY)/skala });

/* ---------------- Steuerkreuz (Touch) ---------------- */
const TOUCH = matchMedia('(pointer: coarse)').matches;
const pad = { 0:{}, 1:{} };
const PAD = [
  { x: 78,  y: 0, r: 44, spieler:0, akt:'links'  },
  { x: 188, y: 0, r: 44, spieler:0, akt:'rechts' },
  { x: 336, y: 0, r: 52, spieler:0, akt:'sprung' },
  { x: 664, y: 0, r: 52, spieler:1, akt:'sprung' },
  { x: 812, y: 0, r: 44, spieler:1, akt:'links'  },
  { x: 922, y: 0, r: 44, spieler:1, akt:'rechts' }
];
const padY = () => VH - 46 - sicherUnten;

const zeiger = new Map();
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  tonAn();
  if (pausiert){ pausiert = false; return; }
  const p = virt(e);
  for (const k of knoepfe){
    if (p.x>k.x && p.x<k.x+k.w && p.y>k.y && p.y<k.y+k.h){ k.tu(); piep(560,0.05,'triangle'); return; }
  }
  if (modus === 'spiel' && TOUCH){
    const y = padY();
    for (const b of PAD){
      if (Math.hypot(p.x-b.x, p.y-y) < b.r*1.35){ pad[b.spieler][b.akt] = true; zeiger.set(e.pointerId, b); return; }
    }
  }
}, {passive:false});
cv.addEventListener('pointermove', e => {
  const b = zeiger.get(e.pointerId); if (!b) return;
  e.preventDefault();
  const p = virt(e);
  if (Math.hypot(p.x-b.x, p.y-padY()) > b.r*2.4){ pad[b.spieler][b.akt] = false; zeiger.delete(e.pointerId); }
}, {passive:false});
const weg = e => { const b = zeiger.get(e.pointerId); if (b){ pad[b.spieler][b.akt] = false; zeiger.delete(e.pointerId); } };
cv.addEventListener('pointerup', weg);
cv.addEventListener('pointercancel', weg);
cv.addEventListener('lostpointercapture', weg);
document.addEventListener('touchmove', e => e.preventDefault(), {passive:false});
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
  taste[e.key.toLowerCase()] = true;
  if (modus === 'quiz' && '1234'.includes(e.key)) antwort(+e.key - 1);
  if (e.key === ' '){
    if (pausiert) pausiert = false;
    else if (modus === 'menue') starten();
    else if (modus === 'ende') modus = 'menue';
  }
});
addEventListener('keyup', e => taste[e.key.toLowerCase()] = false);

/* ---------------- Ablauf ---------------- */
function starten(){
  modus = 'spiel'; pausiert = false;
  spieler.forEach((s,i) => { s.punkte = 0; s.gerettet = 0; s.x = i?750:250; s.y = BODEN; s.vx = s.vy = 0; });
  konfetti.length = 0; sieger = null; meldungZeit = 0;
  aufschlag(Math.random() < .5 ? 0 : 1);
}

function aufschlag(seite){
  ball.seite = seite;
  ball.x = spieler[seite].x; ball.y = 150;
  ball.vx = 0; ball.vy = 0; ball.rot = 0;
  ball.ruht = true; ball.halt = 100; ball.spur.length = 0;
}

function melde(txt, farbe = GELB){ meldung = { txt, farbe }; meldungZeit = 100; }

function punktFuer(gewinner){
  piep(170, 0.28, 'sawtooth', 0.09);
  const gesamt = spieler[0].punkte + spieler[1].punkte;
  const sekunden = Math.max(6, 11 - gesamt * 0.5);      // je später im Match, desto knapper
  quiz = { spieler: 1-gewinner, gewinner, frage: naechsteFrage(),
           dauer: sekunden*60, uhr: sekunden*60, gewaehlt: -1, phase:'offen', warten:0 };
  modus = 'quiz';
}

function zaehle(gewinner){
  spieler[gewinner].punkte++;
  if (spieler[gewinner].punkte >= zielPunkte){
    sieger = gewinner; modus = 'ende';
    for (let i=0;i<150;i++) konfetti.push({
      x: Math.random()*VB, y: -Math.random()*VH, vx:(Math.random()-.5)*2, vy: 2+Math.random()*3,
      r: 4+Math.random()*7, f:[GELB,ROT,TUERKIS,PINK,GRUEN][(Math.random()*5)|0], w: Math.random()*TAU
    });
    piep(880, 0.45, 'square', 0.07);
  } else aufschlag(1 - gewinner);
}

function antwort(i){
  if (!quiz || quiz.phase !== 'offen' || i >= quiz.frage.a.length) return;
  quiz.gewaehlt = i;
  const gut = i === quiz.frage.r;
  quiz.phase = gut ? 'richtig' : 'falsch';
  quiz.warten = gut ? 100 : 165;
  if (gut) spieler[quiz.spieler].gerettet++;
  piep(gut ? 780 : 190, 0.3, gut ? 'triangle' : 'sawtooth');
}

function quizFertig(){
  const q = quiz; quiz = null; modus = 'spiel';
  if (q.phase === 'richtig'){
    melde(CHARS[spieler[q.spieler].key].name + ' rettet den Punkt!', GRUEN);
    aufschlag(q.spieler);
  } else {
    melde('Punkt für ' + CHARS[spieler[q.gewinner].key].name, ROT);
    zaehle(q.gewinner);
  }
}

/* ---------------- Physik ---------------- */
function physik(dt){
  if (meldungZeit > 0) meldungZeit -= dt;

  spieler.forEach((s, i) => {
    const l = i===0 ? (taste['a'] || pad[0].links)  : (taste['arrowleft']  || pad[1].links);
    const r = i===0 ? (taste['d'] || pad[0].rechts) : (taste['arrowright'] || pad[1].rechts);
    const j = i===0 ? (taste['w'] || pad[0].sprung) : (taste['arrowup']    || pad[1].sprung);
    s.vx += ((r?1:0) - (l?1:0)) * LAUF * dt;
    s.vx *= Math.pow(REIB, dt);
    if (j && s.y >= BODEN - 0.5){ s.vy = SPRUNG; piep(430, 0.05, 'sine', 0.06); }
    s.vy += G_FIGUR * dt;
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.y > BODEN){ s.y = BODEN; s.vy = 0; }
    const min = i===0 ? 56 : NETZ_X + NETZ_B/2 + 20;
    const max = i===0 ? NETZ_X - NETZ_B/2 - 20 : VB - 56;
    if (s.x < min){ s.x = min; s.vx = 0; }
    if (s.x > max){ s.x = max; s.vx = 0; }
  });

  if (ball.ruht){
    ball.halt -= dt;
    ball.x = spieler[ball.seite].x;
    ball.y = 150;
    if (ball.halt <= 0){ ball.ruht = false; ball.vy = 0.5; }
    return;
  }

  // Bewegung
  ball.vy += G_BALL * dt;
  ball.vx *= Math.pow(0.9992, dt);
  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;
  ball.rot += ball.vx * 0.028 * dt;

  ball.spur.push({ x:ball.x, y:ball.y });
  if (ball.spur.length > 16) ball.spur.shift();

  // Seiten: Ball bleibt im Spiel (Arcade-Wand), kein Deckel nach oben
  if (ball.x < ball.r + 6){ ball.x = ball.r + 6; ball.vx = Math.abs(ball.vx)*0.88; piep(300,0.05,'square',0.05); }
  if (ball.x > VB - ball.r - 6){ ball.x = VB - ball.r - 6; ball.vx = -Math.abs(ball.vx)*0.88; piep(300,0.05,'square',0.05); }

  // Netz
  const nl = NETZ_X - NETZ_B/2 - ball.r, nr = NETZ_X + NETZ_B/2 + ball.r;
  if (ball.y > NETZ_OBEN && ball.x > nl && ball.x < nr){
    if (ball.x < NETZ_X){ ball.x = nl; ball.vx = -Math.abs(ball.vx)*0.62; }
    else { ball.x = nr; ball.vx = Math.abs(ball.vx)*0.62; }
    ball.vy *= 0.9;
    piep(235,0.06,'triangle',0.06);
  } else if (ball.y <= NETZ_OBEN){
    const dx = ball.x - NETZ_X, dy = ball.y - NETZ_OBEN, d = Math.hypot(dx,dy);
    if (d < ball.r + 9 && d > 0){
      const nx = dx/d, ny = dy/d;
      ball.x = NETZ_X + nx*(ball.r+9); ball.y = NETZ_OBEN + ny*(ball.r+9);
      const dot = ball.vx*nx + ball.vy*ny;
      ball.vx = (ball.vx - 1.6*dot*nx) * 0.86;
      ball.vy = (ball.vy - 1.6*dot*ny) * 0.86;
      piep(300,0.06,'triangle',0.06);
    }
  }

  // Spieler: Abprall über den Kontaktwinkel, plus Impuls der Figur
  for (const s of spieler){
    const cx = s.x, cy = s.y - 60;
    const dx = ball.x - cx, dy = ball.y - cy, d = Math.hypot(dx, dy);
    if (d < s.r + ball.r && d > 0.001){
      const nx = dx/d, ny = dy/d;
      ball.x = cx + nx*(s.r + ball.r + 1.5);
      ball.y = cy + ny*(s.r + ball.r + 1.5);

      const antritt = Math.hypot(s.vx, s.vy);
      const kraft = 10.4 + Math.min(4.6, Math.hypot(ball.vx, ball.vy) * 0.26)
                         + Math.min(4.2, antritt * 0.5);
      ball.vx = nx*kraft + s.vx*0.5;
      ball.vy = ny*kraft + s.vy*0.55;

      // Schmetterball: von oben in den fallenden Ball springen
      if (ny > 0.25 && s.vy < -3) ball.vy += 3.2;

      const sp = Math.hypot(ball.vx, ball.vy);
      if (sp > MAX_BALL){ ball.vx *= MAX_BALL/sp; ball.vy *= MAX_BALL/sp; }
      ball.rot += (Math.random()-.5)*0.4;
      piep(500 + Math.random()*140, 0.07, 'triangle', 0.08);
    }
  }

  // Sand: Punkt
  if (ball.y > BODEN - ball.r){
    ball.y = BODEN - ball.r;
    punktFuer(ball.x < NETZ_X ? 1 : 0);
  }
}

/* ---------------- Zeichnen ---------------- */
const rundRect = (x,y,w,h,r) => { ctx.beginPath(); ctx.roundRect(x,y,w,h,r); };

function kulisse(){
  const himmel = ctx.createLinearGradient(0,-200,0,BODEN);
  himmel.addColorStop(0,'#6ECFE6'); himmel.addColorStop(.65,'#B9ECF3'); himmel.addColorStop(1,'#E7F7EF');
  ctx.fillStyle = himmel; ctx.fillRect(-400,-400, VB+800, VH+400);

  ctx.fillStyle = GELB;
  ctx.beginPath(); ctx.arc(862, 92, 50, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,212,0,.3)'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.arc(862, 92, 70, 0, TAU); ctx.stroke();

  ctx.fillStyle = TUERKIS; ctx.fillRect(0, 330, VB, 88);
  ctx.fillStyle = TIEF; ctx.fillRect(0, 330, VB, 24);
  ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 4;
  for (let i=0;i<7;i++){
    const y = 350 + i*10;
    ctx.beginPath();
    for (let x=-20;x<=VB+20;x+=20) ctx.lineTo(x, y + Math.sin((x + zeit*(1.3+i*0.2))*0.02 + i)*3);
    ctx.stroke();
  }
  ctx.fillStyle = SAND; ctx.fillRect(0, 412, VB, VH-412+200);
  ctx.fillStyle = '#E3BE76'; ctx.fillRect(0, 412, VB, 9);
  ctx.fillStyle = 'rgba(255,255,255,.3)';
  for (let i=0;i<60;i++){ const x=(i*173)%VB, y=430+((i*97)%140); ctx.beginPath(); ctx.arc(x,y,2.2,0,TAU); ctx.fill(); }
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(40, BODEN+6); ctx.lineTo(VB-40, BODEN+6); ctx.stroke();

  ctx.fillStyle = '#8A5A2B'; ctx.strokeStyle = TINTE; ctx.lineWidth = 4;
  rundRect(NETZ_X-NETZ_B/2, NETZ_OBEN, NETZ_B, BODEN-NETZ_OBEN+8, 5); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2.2;
  for (let y = NETZ_OBEN+16; y < BODEN; y += 16){
    ctx.beginPath(); ctx.moveTo(NETZ_X-25, y); ctx.lineTo(NETZ_X+25, y); ctx.stroke();
  }
  ctx.fillStyle = SCHAUM; ctx.strokeStyle = TINTE; ctx.lineWidth = 4;
  rundRect(NETZ_X-29, NETZ_OBEN-14, 58, 16, 8); ctx.fill(); ctx.stroke();
}

function zeichneFigur(s, i){
  const img = bilder[CHARS[s.key].bild];
  const h = 168, b = h * (img && img.height ? img.width/img.height : 0.58);
  ctx.save();
  ctx.translate(s.x, s.y);
  const luft = Math.max(0, (BODEN - s.y)/140);
  ctx.fillStyle = 'rgba(70,45,10,.26)';
  ctx.beginPath(); ctx.ellipse(6, BODEN - s.y + 6, 52*(1-luft*0.3), 12*(1-luft*0.3), 0, 0, TAU); ctx.fill();
  ctx.rotate(Math.max(-.2, Math.min(.2, s.vx*0.03)));
  ctx.strokeStyle = CHARS[s.key].farbe; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.ellipse(0, 2, 54, 15, 0, 0, TAU); ctx.stroke();
  if (img && img.complete){
    ctx.save();
    if (i === 1) ctx.scale(-1, 1);
    ctx.drawImage(img, -b/2, -h + 10, b, h);
    ctx.restore();
  }
  ctx.restore();
}

function zeichneBall(){
  for (let i=0;i<ball.spur.length;i++){
    const p = ball.spur[i], a = (i/ball.spur.length)*0.28;
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, ball.r*(0.35 + i/ball.spur.length*0.55), 0, TAU); ctx.fill();
  }
  ctx.save(); ctx.translate(ball.x, ball.y); ctx.rotate(ball.rot);
  ctx.fillStyle = SCHAUM; ctx.beginPath(); ctx.arc(0,0,ball.r,0,TAU); ctx.fill();
  const farben = [ROT, TUERKIS, GELB];
  for (let i=0;i<3;i++){
    ctx.fillStyle = farben[i];
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.arc(0,0,ball.r, i*TAU/3 + 0.15, i*TAU/3 + TAU/6); ctx.closePath(); ctx.fill();
  }
  ctx.lineWidth = 3.4; ctx.strokeStyle = TINTE;
  ctx.beginPath(); ctx.arc(0,0,ball.r,0,TAU); ctx.stroke();
  ctx.restore();

  // Ball über dem Bild: Pfeil am oberen Rand
  if (ball.y < 34){
    const x = Math.max(30, Math.min(VB-30, ball.x)), y = 24 + sicherOben;
    ctx.fillStyle = 'rgba(20,24,27,.75)';
    ctx.beginPath(); ctx.moveTo(x-16, y+12); ctx.lineTo(x+16, y+12); ctx.lineTo(x, y-10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = GELB;
    ctx.beginPath(); ctx.arc(x, y+22, 6, 0, TAU); ctx.fill();
  }

  if (ball.ruht){
    ctx.fillStyle = 'rgba(20,24,27,.55)';
    ctx.font = 'bold 26px -apple-system, system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(Math.ceil(ball.halt/60), ball.x, ball.y - 38);
  }
}

function kopfKreis(key, x, y, r){
  const img = bilder[CHARS[key].bild];
  ctx.save();
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  ctx.fillStyle = CHARS[key].farbe; ctx.fill(); ctx.clip();
  if (img && img.complete){
    const h = r*2.9, b = h*img.width/img.height;
    ctx.drawImage(img, x-b/2, y-h*0.42, b, h);
  }
  ctx.restore();
  ctx.lineWidth = 4; ctx.strokeStyle = TINTE;
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.stroke();
}

function tafelOben(){
  const y = 12 + sicherOben;
  ctx.fillStyle = 'rgba(20,24,27,.5)';
  rundRect(VB/2-176, y, 352, 58, 20); ctx.fill();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font = 'bold 38px -apple-system, "SF Pro Display", system-ui, sans-serif';
  ctx.fillStyle = SCHAUM;
  ctx.fillText(spieler[0].punkte + ' : ' + spieler[1].punkte, VB/2, y+28);
  ctx.font = 'bold 13px -apple-system, system-ui, sans-serif';
  ctx.fillStyle = 'rgba(243,250,252,.65)';
  ctx.fillText('bis ' + zielPunkte, VB/2, y+50);
  kopfKreis(spieler[0].key, VB/2-142, y+29, 25);
  kopfKreis(spieler[1].key, VB/2+142, y+29, 25);
}

function steuerkreuz(){
  if (!TOUCH || modus !== 'spiel') return;
  const y = padY();
  ctx.globalAlpha = 0.3;
  for (const b of PAD){
    ctx.fillStyle = pad[b.spieler][b.akt] ? GELB : 'rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.arc(b.x, y, b.r, 0, TAU); ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = TINTE; ctx.stroke();
    ctx.fillStyle = TINTE;
    ctx.save(); ctx.translate(b.x, y);
    if (b.akt === 'sprung') ctx.rotate(-Math.PI/2);
    if (b.akt === 'links') ctx.rotate(Math.PI);
    ctx.beginPath(); ctx.moveTo(-9,-13); ctx.lineTo(13,0); ctx.lineTo(-9,13); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function meldungMalen(){
  if (meldungZeit <= 0 || !meldung) return;
  ctx.globalAlpha = Math.min(1, meldungZeit/25);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font = 'bold 38px -apple-system, "SF Pro Display", system-ui, sans-serif';
  ctx.lineWidth = 8; ctx.strokeStyle = TINTE;
  ctx.strokeText(meldung.txt, VB/2, 150 + sicherOben);
  ctx.fillStyle = meldung.farbe; ctx.fillText(meldung.txt, VB/2, 150 + sicherOben);
  ctx.globalAlpha = 1;
}

function knopf(x,y,w,h,text,tu,farbe=ROT,tf='#fff',klein=false){
  knoepfe.push({x,y,w,h,tu});
  ctx.fillStyle = farbe; rundRect(x,y,w,h,h/2); ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = TINTE; ctx.stroke();
  ctx.fillStyle = tf; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font = `bold ${klein?18:24}px -apple-system, "SF Pro Display", system-ui, sans-serif`;
  ctx.fillText(text, x+w/2, y+h/2+1);
}

function umbruch(text, x, y, breite, zh){
  const worte = text.split(' '); const zeilen = []; let z = '';
  for (const w of worte){
    if (ctx.measureText(z + ' ' + w).width > breite && z){ zeilen.push(z); z = w; }
    else z = z ? z + ' ' + w : w;
  }
  zeilen.push(z);
  zeilen.forEach((l,i) => ctx.fillText(l, x, y + i*zh - (zeilen.length-1)*zh/2));
}

function menue(){
  ctx.fillStyle = 'rgba(9,58,78,.9)'; ctx.fillRect(-400,-400,VB+800,VH+800);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font = 'bold 52px -apple-system, "SF Pro Display", system-ui, sans-serif';
  ctx.fillStyle = GELB; ctx.fillText('BEACH DUELL', VB/2, 60 + sicherOben*0.6);
  ctx.font = '18px -apple-system, system-ui, sans-serif'; ctx.fillStyle = SCHAUM;
  ctx.fillText('Zwei Spieler, ein Bildschirm — jeder verlorene Ball geht in die Rettungsfrage', VB/2, 98 + sicherOben*0.6);

  [0,1].forEach(i => {
    const cx = i ? 690 : 310, s = spieler[i];
    ctx.fillStyle = 'rgba(255,255,255,.09)';
    rundRect(cx-150, 132, 300, 262, 26); ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = CHARS[s.key].farbe; ctx.stroke();
    kopfKreis(s.key, cx, 212, 56);
    ctx.fillStyle = SCHAUM; ctx.font = 'bold 29px -apple-system, system-ui, sans-serif';
    ctx.fillText(CHARS[s.key].name, cx, 292);
    ctx.fillStyle = 'rgba(243,250,252,.6)'; ctx.font = '15px -apple-system, system-ui, sans-serif';
    ctx.fillText('„' + CHARS[s.key].spruch + '"', cx, 316);
    ctx.fillStyle = CHARS[s.key].farbe; ctx.font = 'bold 15px -apple-system, system-ui, sans-serif';
    ctx.fillText(i ? 'SPIELER 2  ·  ← → ↑' : 'SPIELER 1  ·  A D W', cx, 156);
    knopf(cx-100, 340, 200, 42, 'Charakter wechseln', () => {
      s.key = CHARKEYS[(CHARKEYS.indexOf(s.key)+1) % CHARKEYS.length];
    }, 'rgba(255,255,255,.15)', SCHAUM, true);
  });

  knopf(VB/2-230, 414, 210, 50, 'Ziel: ' + zielPunkte + ' Punkte',
        () => zielPunkte = zielPunkte === 3 ? 5 : zielPunkte === 5 ? 7 : 3,
        'rgba(255,255,255,.15)', SCHAUM, true);
  knopf(VB/2+20, 414, 210, 50, ton ? 'Ton: an' : 'Ton: aus', () => { ton = !ton; if (ton) tonAn(); },
        'rgba(255,255,255,.15)', SCHAUM, true);
  knopf(VB/2-130, 480, 260, 58, 'Los geht’s', starten, ROT);

  ctx.fillStyle = 'rgba(243,250,252,.5)'; ctx.font = '14px -apple-system, system-ui, sans-serif';
  const zeileUnten = VH - 12 - sicherUnten*0.5;
  if (TOUCH && Hh > W) ctx.fillText('Tipp: Gerät quer halten — dann hat jeder eine Seite', VB/2, zeileUnten);
  else ctx.fillText(TOUCH ? 'Je drei Tasten unten links und unten rechts · Safari-Teilen → „Zum Home-Bildschirm"'
                          : 'Spieler 1: A / D / W  ·  Spieler 2: Pfeiltasten  ·  Antworten mit 1–4', VB/2, zeileUnten);
}

function quizMalen(){
  const q = quiz, s = spieler[q.spieler];
  ctx.fillStyle = 'rgba(9,58,78,.94)'; ctx.fillRect(-400,-400,VB+800,VH+800);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const o = sicherOben*0.5;

  kopfKreis(s.key, VB/2, 54+o, 36);
  ctx.fillStyle = GELB; ctx.font = 'bold 25px -apple-system, system-ui, sans-serif';
  ctx.fillText('Rettungsfrage für ' + CHARS[s.key].name, VB/2, 110+o);
  ctx.fillStyle = 'rgba(243,250,252,.6)'; ctx.font = '15px -apple-system, system-ui, sans-serif';
  ctx.fillText('Richtig = Punkt annulliert und Aufschlag · bereits gerettet: ' + s.gerettet, VB/2, 134+o);

  ctx.fillStyle = ROT; rundRect(VB/2-78, 152+o, 156, 28, 14); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 14px -apple-system, system-ui, sans-serif';
  ctx.fillText(q.frage.k.toUpperCase(), VB/2, 167+o);

  ctx.fillStyle = SCHAUM; ctx.font = 'bold 26px -apple-system, "SF Pro Display", system-ui, sans-serif';
  umbruch(q.frage.f, VB/2, 214+o, 800, 32);

  const bw = 404, bh = 54;
  q.frage.a.forEach((txt, i) => {
    const x = VB/2 - bw - 10 + (i%2)*(bw+20), y = 280+o + Math.floor(i/2)*(bh+14);
    let farbe = 'rgba(255,255,255,.13)', tf = SCHAUM;
    if (q.phase !== 'offen'){
      if (i === q.frage.r){ farbe = GRUEN; tf = TINTE; }
      else if (i === q.gewaehlt){ farbe = ROT; tf = '#fff'; }
    } else knoepfe.push({x, y, w:bw, h:bh, tu: () => antwort(i)});
    ctx.fillStyle = farbe; rundRect(x, y, bw, bh, 16); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = TINTE; ctx.stroke();
    ctx.fillStyle = tf; ctx.font = 'bold 19px -apple-system, system-ui, sans-serif';
    ctx.textAlign = 'left';
    umbruchEinzeilig((i+1)+'.  '+txt, x+20, y+bh/2+1, bw-38);
    ctx.textAlign = 'center';
  });

  const anteil = Math.max(0, q.uhr/q.dauer);
  ctx.fillStyle = 'rgba(255,255,255,.14)'; rundRect(VB/2-300, 462+o, 600, 14, 7); ctx.fill();
  ctx.fillStyle = anteil > .35 ? GELB : ROT; rundRect(VB/2-300, 462+o, 600*anteil, 14, 7); ctx.fill();
  ctx.fillStyle = 'rgba(243,250,252,.6)'; ctx.font = 'bold 14px -apple-system, system-ui, sans-serif';
  ctx.fillText(Math.ceil(q.uhr/60) + ' s', VB/2, 452+o);

  if (q.phase === 'offen'){
    knopf(VB/2-95, 492+o, 190, 40, 'Punkt hergeben',
          () => { q.phase = 'falsch'; q.gewaehlt = -1; q.warten = 90; },
          'rgba(255,255,255,.11)', 'rgba(243,250,252,.8)', true);
  } else {
    ctx.fillStyle = q.phase === 'richtig' ? GRUEN : ROT;
    ctx.font = 'bold 30px -apple-system, system-ui, sans-serif';
    ctx.fillText(q.phase === 'richtig' ? 'Gerettet!' : 'Daneben', VB/2, 512+o);
  }
}

function umbruchEinzeilig(txt, x, y, max){
  let t = txt;
  while (ctx.measureText(t).width > max && t.length > 4) t = t.slice(0, -2);
  ctx.fillText(t === txt ? txt : t + '…', x, y);
}

function endeMalen(){
  ctx.fillStyle = 'rgba(9,58,78,.9)'; ctx.fillRect(-400,-400,VB+800,VH+800);
  for (const k of konfetti){
    ctx.save(); ctx.translate(k.x, k.y); ctx.rotate(k.w);
    ctx.fillStyle = k.f; ctx.fillRect(-k.r/2, -k.r/2, k.r, k.r*1.6); ctx.restore();
  }
  const s = spieler[sieger];
  ctx.textAlign='center'; ctx.textBaseline='middle';
  kopfKreis(s.key, VB/2, 176, 82);
  ctx.fillStyle = GELB; ctx.font = 'bold 54px -apple-system, "SF Pro Display", system-ui, sans-serif';
  ctx.fillText(CHARS[s.key].name + ' gewinnt!', VB/2, 302);
  ctx.fillStyle = SCHAUM; ctx.font = '26px -apple-system, system-ui, sans-serif';
  ctx.fillText(spieler[0].punkte + ' : ' + spieler[1].punkte, VB/2, 346);
  ctx.fillStyle = 'rgba(243,250,252,.65)'; ctx.font = '17px -apple-system, system-ui, sans-serif';
  ctx.fillText('Gerettete Punkte — ' + CHARS[spieler[0].key].name + ': ' + spieler[0].gerettet
             + ' · ' + CHARS[spieler[1].key].name + ': ' + spieler[1].gerettet, VB/2, 380);
  knopf(VB/2-260, 424, 240, 58, 'Revanche', starten, ROT);
  knopf(VB/2+20, 424, 240, 58, 'Menü', () => modus = 'menue', 'rgba(255,255,255,.15)', SCHAUM);
}

function pauseMalen(){
  ctx.fillStyle = 'rgba(9,58,78,.82)'; ctx.fillRect(-400,-400,VB+800,VH+800);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle = GELB; ctx.font = 'bold 46px -apple-system, system-ui, sans-serif';
  ctx.fillText('Pause', VB/2, VH/2 - 16);
  ctx.fillStyle = SCHAUM; ctx.font = '20px -apple-system, system-ui, sans-serif';
  ctx.fillText('Tippen zum Weiterspielen', VB/2, VH/2 + 26);
}

/* ---------------- Schleife ---------------- */
let letzte = performance.now();
function schleife(jetzt){
  const dt = Math.min(2.2, (jetzt - letzte)/16.667) || 1;
  letzte = jetzt;
  knoepfe.length = 0;

  if (!pausiert){
    zeit += dt;
    if (modus === 'spiel') physik(dt);
    if (modus === 'quiz'){
      if (quiz.phase === 'offen'){
        quiz.uhr -= dt;
        if (quiz.uhr <= 0){ quiz.phase = 'falsch'; quiz.gewaehlt = -1; quiz.warten = 140; }
      } else {
        quiz.warten -= dt;
        if (quiz.warten <= 0) quizFertig();
      }
    }
    if (modus === 'ende'){
      for (const k of konfetti){
        k.x += k.vx*dt; k.y += k.vy*dt; k.w += 0.05*dt;
        if (k.y > VH+20){ k.y = -20; k.x = Math.random()*VB; }
      }
    }
  }

  kulisse();
  spieler.forEach(zeichneFigur);
  if (modus === 'spiel' || modus === 'quiz') zeichneBall();
  if (modus === 'spiel'){ tafelOben(); steuerkreuz(); meldungMalen(); }
  if (modus === 'menue') menue();
  if (modus === 'quiz') quizMalen();
  if (modus === 'ende') endeMalen();
  if (pausiert && modus !== 'menue') pauseMalen();

  requestAnimationFrame(schleife);
}

masse();
setTimeout(masse, 300);
requestAnimationFrame(schleife);
})();
</script>
